apiVersion: nvr.plugin/v1
kind: Plugin
metadata:
  id: plate-ocr
  name: Plate OCR
  version: 1.0.0
spec:
  capabilities:
    - frames:read
    - events:publish
    - snapshots:write
    - config:read
  frameProfile:
    maxFps: 15
    maxWidth: 4096
    maxHeight: 2160
    pixelFormat: JPEG
  resources:
    cpu: "2"
    memory: "1Gi"
    gpu: none
  events:
    consumes: []
    publishes:
      - nvr.event.plate.detected.v1
